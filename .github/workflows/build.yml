name: Build and Publish Add-on

on:
  push:
    branches:
      - main
    paths:
      - 'moltbot/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Get add-on version
        id: version
        run: |
          VERSION=$(grep '^version:' moltbot/config.yaml | sed 's/version: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get base image
        id: base
        run: |
          BASE=$(grep '${{ matrix.arch }}:' moltbot/build.yaml | sed 's/^[^:]*: *//')
          echo "image=$BASE" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: moltbot
          file: moltbot/Dockerfile
          platforms: linux/${{ matrix.arch == 'aarch64' && 'arm64' || 'amd64' }}
          push: true
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.image }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.arch }}-addon-moltbot:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}/${{ matrix.arch }}-addon-moltbot:latest
          labels: |
            org.opencontainers.image.title=Moltbot
            org.opencontainers.image.description=Your personal AI assistant for Home Assistant
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
